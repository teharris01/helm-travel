<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Helm</title>

<!-- Installable on your phone home screen: add-to-home-screen works from any browser
     without needing a separate manifest file for this first version. -->

<style>
  :root {
    color-scheme: light;
    --bg: #f4f7f6;
    --panel: #ffffff;
    --panel-border: #e2e8e5;
    --text: #16302d;
    --muted: #66766f;
    --accent: #2f6fbd;
    --booked: #1f6b3d;
    --pending: #8a5a00;
    --unverified: #9a3412;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }

  /* ---- Sign-in screen ---- */
  #signin { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  #signin h1 { font-size: 20px; margin-bottom: 4px; }
  #signin p.sub { color: var(--muted); font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  #signin label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  #signin input {
    width: 100%; padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
    font-size: 16px;
  }
  #signin button {
    width: 100%; margin-top: 22px; padding: 12px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #signin button:disabled { opacity: 0.5; }
  #signin .error { color: #b3401f; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---- Trip screen ---- */
  header.trip { margin-bottom: 20px; }
  header.trip h1 { font-size: 22px; margin: 0 0 2px; }
  header.trip .dest { color: var(--muted); font-size: 14px; }
  header.trip .dates { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .status-pill {
    display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: #223; color: var(--muted); margin-top: 8px; text-transform: capitalize;
  }

  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 28px 0 10px; }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 13px 14px; margin-bottom: 10px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge.booked { background: #dff2e6; color: #1f6b3d; }
  .badge.pending { background: #ffedc2; color: #8a5a00; }
  .badge.unverified { background: #fde3d6; color: #9a3412; }
  .badge.optional { background: #eef1ef; color: var(--muted); }
  .badge.open { background: #ffedc2; color: #8a5a00; }
  .badge.done { background: #dff2e6; color: #1f6b3d; }

  .card-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card-when { color: var(--text); font-size: 13px; margin-top: 6px; }
  .card-prov { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .provenance {
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--panel-border);
    font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  /* ---- Top-level nav: Today / Travel ---- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .brand { font-size: 18px; font-weight: 700; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 9px; padding: 3px; }
  .tab-btn { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .view[hidden] { display: none; }

  /* ---- Today (brief) view ---- */
  .brief-card { margin-bottom: 10px; }
  .brief-date { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .brief-headline { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 14px; }
  .brief-section { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 16px 0 8px; }
  .brief-section:first-of-type { margin-top: 0; }
  .brief-list { margin: 0; padding-left: 20px; }
  .brief-list li { margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
  .brief-list li strong { color: var(--text); }
  /* ---- 7-day week grid (inside the brief card) ---- */
  .wg { margin: 4px 0 14px; }
  .wg-grid { display: grid; grid-template-columns: 26px repeat(7, 1fr); column-gap: 3px; }
  .wg-hd { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 3px; line-height: 1.2; }
  .wg-hd b { display: block; color: var(--text); font-size: 12px; }
  .wg-hd.today b { color: var(--accent); }
  .wg-col { position: relative; background: #eef2f0; border-radius: 5px; overflow: hidden; }
  .wg-ecol { position: relative; border: 1px dashed var(--panel-border); border-radius: 5px; overflow: hidden; }
  .wg-axis { position: relative; font-size: 9px; color: var(--muted); }
  .wg-axis span { position: absolute; right: 2px; transform: translateY(-50%); }
  .wg-sep { grid-column: 1 / -1; height: 6px; }
  .wg-seg { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; font-size: 9px; font-weight: 600; line-height: 1.1; padding: 0 1px; overflow: hidden; }
  .wg-seg.busy, .wg-seg.mine { background: #f6d3d5; color: #8a3b40; }
  .wg-seg.open { background: #2e9e66; color: #fff; letter-spacing: 0.03em; }
  .wg-seg.family { background: #f6d86a; color: #6b5200; }
  .wg-seg.away { background: #5b9bd5; color: #fff; }
  .wg-seg span { font-weight: 500; overflow-wrap: anywhere; }
  .wg-seg.multi { font-size: 0; }
  .wg-seg.multi span { display: none; }
  .wg-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .wg-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .brief-stale { color: #8a5a00; }

  /* ---- Sync status (heartbeat) ---- */
  .sync-status {
    margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--panel-border);
    color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap;
  }
  .sync-status .job { display: inline-flex; align-items: center; gap: 5px; }
  .sync-status .ok { color: #1f6b3d; }
  .sync-status .warn { color: #8a5a00; }

  /* ---- Trip memory (resurfaced past review) ---- */
  .memory-card { background: #e3edf7; border: 1px solid var(--accent); }
  .memory-card .memory-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent); margin-bottom: 6px;
  }

  /* ---- Trip review (post-trip memory capture) ---- */
  .review-card textarea {
    width: 100%; min-height: 80px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border); background: var(--bg); color: var(--text);
    font-size: 14px; font-family: inherit; resize: vertical;
  }
  .review-card .would-return { display: flex; gap: 8px; margin: 10px 0; }
  .review-card .would-return button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .review-card .would-return button.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .review-card .save-btn {
    margin-top: 4px; padding: 10px 14px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .review-card .save-btn:disabled { opacity: 0.5; }
  .review-card .saved-note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* =========================================================================
     Travel dashboard — multi-trip list + per-trip detail view.
     Ported from Tim's "Travel Dashboard" artifact and adapted to Helm's dark
     theme (the artifact itself is a light-mode mockup — panels/pills below use
     Helm's existing --panel/--panel-border/--muted rather than its palette,
     while each trip keeps its own gradient color identity via --tclr/-dark/-soft
     set inline per card so new trips added later don't need any CSS changes).
     ========================================================================= */

  /* ---- stats bar ---- */
  .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card { flex: 1; min-width: 130px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 11px 14px; }
  .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
  .stat-value { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---- list sections ---- */
  .list-section { margin-bottom: 26px; }
  .list-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }

  /* ---- trip card grid ---- */
  .trip-grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .trip-grid2 { grid-template-columns: 1fr 1fr; } }
  .trip-card2 { border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--panel-border); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  .trip-card2:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(23,49,47,.14); }
  .trip-card2.next { box-shadow: 0 0 0 2px var(--tclr, var(--accent)); }
  .trip-card2:focus-visible { outline: 2px solid var(--tclr, var(--accent)); outline-offset: 2px; }
  .tc-header { padding: 14px 16px 12px; color: #fff; background: linear-gradient(135deg, var(--tclr-dark, #2a3b6b), var(--tclr, var(--accent))); }
  .tc-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tc-icon { font-size: 18px; }
  .tc-badges { display: flex; gap: 6px; }
  .tc-badge { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 3px 7px; border-radius: 999px; background: rgba(255,255,255,.22); }
  .tc-badge.tc-next { background: #fff; color: var(--tclr-dark, #22345c); }
  .tc-dest { font-size: 17px; font-weight: 800; margin-top: 8px; }
  .tc-dates { margin-top: 4px; }
  .tc-dates span { display: block; font-size: 12.5px; font-weight: 700; opacity: .95; }
  .tc-body { padding: 12px 16px 14px; }
  .tc-people { font-size: 12px; color: var(--muted); }
  .tc-summary { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .tc-chips { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }

  /* ---- status pill system ---- */
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .pill-booked { background: #dff2e6; color: #1f6b3d; }
  .pill-requested { background: #ffedc2; color: #8a5a00; }
  .pill-open { background: #eef1ef; color: #6b7a75; }
  .pill-flag { background: #fde3d6; color: #9a3412; }
  .pill-info { background: #e3edf7; color: #2f5c8a; }

  /* ---- someday / archive mini-cards ---- */
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
  .mini-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 13px 15px; }
  .mini-card.faded { opacity: .65; }
  .mini-icon { font-size: 18px; }
  .mini-title { font-weight: 700; font-size: 13.5px; margin-top: 6px; }
  .mini-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mini-status { font-size: 10.5px; color: var(--accent); font-weight: 700; margin-top: 7px; text-transform: uppercase; letter-spacing: .04em; }

  /* ---- current trip (full width) + past trips (ADR-9) ---- */
  .trip-current { display: grid; grid-template-columns: 1fr; }
  .trip-card2.current { box-shadow: 0 0 0 2px var(--tclr, var(--accent)); }
  .tc-badge.tc-current { background: #fff; color: var(--tclr-dark, #22345c); }
  .past-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .past-list { grid-template-columns: 1fr 1fr; } }
  .past-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 13px 15px; }
  .past-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; background: none; border: none; padding: 0; width: 100%; text-align: left; font-family: inherit; color: inherit; }
  .past-title { font-weight: 700; font-size: 14px; }
  .past-dates { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .past-chevron { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .past-line { font-size: 12.5px; margin-top: 8px; line-height: 1.4; }
  .past-line b { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 1px; }
  .past-review { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--panel-border); font-size: 13px; line-height: 1.45; }
  .past-open { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .past-open:hover { text-decoration: underline; }

  /* ---- Dining (ADR-10: second capture domain) ---- */
  .din-btn { padding: 9px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .din-btn.ghost { background: var(--panel); color: var(--muted); border: 1px solid var(--panel-border); }
  .din-btn:disabled { opacity: 0.5; }
  .din-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .din-filter { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--muted); font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .din-filter.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .din-group { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 8px; }
  .din-card { background: var(--panel); border: 1px solid var(--panel-border); border-left: 6px solid hsl(var(--cz-h, 210) 58% 55%); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; }
  .din-card.try { border-left-style: dashed; }
  .din-search { position: relative; margin: 4px 0 8px; }
  .din-search input { width: 100%; box-sizing: border-box; padding: 11px 38px 11px 14px; border-radius: 10px; border: 1px solid var(--panel-border); background: var(--panel); color: inherit; font-size: 16px; font-family: inherit; }
  .din-search button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 9px; cursor: pointer; }
  .din-search-note { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
  .din-contact a { color: var(--accent, #2b6cb0); text-decoration: none; font-weight: 600; }
  .seg-wrap { flex-wrap: wrap; }
  .seg-wrap button { flex: 1 1 22%; min-width: 74px; }
  .din-reserve { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 9px; background: var(--accent, #2b6cb0); color: #fff !important; font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .din-reserve.off { background: transparent; color: var(--muted) !important; border: 1px dashed var(--panel-border); font-weight: 500; font-size: 12.5px; }
  .din-pending { color: var(--muted); font-size: 12.5px; font-style: italic; }
  .din-avoid { margin-top: 26px; border-top: 1px solid var(--panel-border); padding-top: 4px; }
  .din-avoid > summary { cursor: pointer; list-style: none; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 14px 0 8px; }
  .din-avoid > summary::-webkit-details-marker { display: none; }
  .din-avoid > summary::before { content: "\25B8  "; }
  .din-avoid[open] > summary::before { content: "\25BE  "; }
  .din-avoid .din-card { opacity: .62; border-left-color: hsl(0 0% 60%); }
  .din-avoid .din-card:hover { opacity: 1; }
  .din-cz { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 10px 2px 7px; border-radius: 999px;
    background: hsl(var(--cz-h, 210) 80% 93%); color: hsl(var(--cz-h, 210) 60% 24%); border: 1px solid hsl(var(--cz-h, 210) 55% 80%); }
  .din-cz-row { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .din-occ { font-size: 12px; color: var(--muted); }
  .din-cfilters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
  .din-cfilter { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px 4px 8px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600;
    background: hsl(var(--cz-h, 210) 80% 95%); color: hsl(var(--cz-h, 210) 60% 26%); border: 1px solid hsl(var(--cz-h, 210) 55% 82%); }
  .din-cfilter.active { background: hsl(var(--cz-h, 210) 58% 40%); color: #fff; border-color: hsl(var(--cz-h, 210) 58% 40%); }
  .din-verdict.like { background: #e6f4ea; }
  .din-verdict.neutral { color: #8a5a00; border-color: #8a5a00; background: #fbf1dc; }
  .din-verdict.dislike { background: #fdeceb; }
  .din-verdict.try { background: #e3edf7; }
  .din-name { font-weight: 700; font-size: 15px; }
  .din-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .din-verdict { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--panel-border); color: var(--muted); margin-right: 6px; }
  .din-verdict.like { color: #1f6b3d; border-color: #1f6b3d; }
  .din-verdict.dislike { color: #b3261e; border-color: #b3261e; }
  .din-line { font-size: 13px; margin-top: 8px; line-height: 1.4; }
  .din-line b { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 1px; }
  .din-edit { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .din-form label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
  .din-form input[type=text], .din-form select, .din-form textarea { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit; }
  .din-form textarea { min-height: 70px; resize: vertical; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit; }
  .seg button.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .din-actions { display: flex; gap: 8px; margin-top: 16px; }
  .din-verdict.try { color: var(--accent); border-color: var(--accent); }
  .din-went { margin-left: 14px; }
  .rec-status { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--panel-border); color: var(--muted); }
  .rec-status.filed { color: var(--accent); border-color: var(--accent); }
  .rec-status.failed { color: #b3261e; border-color: #b3261e; }

  /* ---- detail view ---- */
  .detail-back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; font-size: 13.5px; cursor: pointer; margin-bottom: 14px; background: none; border: none; padding: 0; font-family: inherit; }
  .detail-back:hover { text-decoration: underline; }
  .hero { color: #fff; border-radius: 16px; padding: 22px; margin-bottom: 18px; background: linear-gradient(135deg, var(--tclr-dark, #2a3b6b), var(--tclr, var(--accent))); }
  .hero .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; font-weight: 700; opacity: .88; }
  .hero h1 { color: #fff; font-size: 1.5rem; line-height: 1.15; margin: 6px 0 3px; }
  .hero .daterange { font-size: .92rem; font-weight: 700; opacity: .95; }
  .hero .hero-subtitle { font-size: .88rem; opacity: .92; margin-top: 6px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .chip { padding: 5px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #fff; }

  .day { display: grid; grid-template-columns: 78px 1fr; gap: 13px; padding: 14px 0; border-top: 1px solid var(--panel-border); }

function fmtDate(d) {
  if (!d) return null;
  // d is a plain "YYYY-MM-DD" date (no time/timezone) from Postgres. Parsing
  // that directly with `new Date()` treats it as UTC midnight, which then
  // rolls back a day once displayed in an earlier-than-UTC timezone (e.g.
  // Eastern). Build the date from its local components instead so the day
  // shown always matches the day stored.
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function fmtCardDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtDateTime(d) {
  if (!d) return null;
  return new Date(d).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtRelative(d) {
  if (!d) return "never verified";
  const then = new Date(d), now = new Date();
  const days = Math.floor((now - then) / 86400000);
  if (days <= 0) return "verified today";
  if (days === 1) return "verified yesterday";
  if (days < 30) return `verified ${days}d ago`;
  return `verified ${then.toLocaleDateString(undefined, { month: "short", year: "numeric" })}`;
}

// The plain "YYYY-MM-DD" for today, in the viewer's local timezone — same
// deliberately timezone-naive shape as the dates Postgres hands back
// elsewhere in this file (see fmtDate above).
function todayLocalDateStr() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}
function fmtBriefTimestamp(d, briefDateStr) {
  const then = new Date(d);
  const timeStr = then.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  // A brief is stale the moment it wasn't generated for today's actual
  // calendar date — exact comparison against the date the brief itself was
  // built for (raw_data.date), not an elapsed-time guess. A once-a-day job
  // that misses a single run produces a brief that's roughly 24-48 hours
  // old depending what time of day this is checked, which can dodge a
  // fixed elapsed-time cutoff either way (this is exactly what happened
  // 2026-09-20: a missed run's ~24h-old brief slipped under the old 36h
  // threshold) — an exact-date check has no such gap.
  const stale = briefDateStr ? briefDateStr !== todayLocalDateStr() : true;
  return { text: `Generated ${timeStr}`, stale };
}

// ---- Sync status (heartbeat) --------------------------------------------
// Surfaces the last run of every scheduled job from sync_log, not just the
// daily brief — this is what lets a silent job failure be seen on the Today
// tab instead of requiring a raw SQL query (ADR-4's "visible heartbeat"
// requirement, extended to cover all three scheduled jobs).
const SYNC_JOBS = [
  { jobName: "daily_brief_lite", label: "Brief" },
  { jobName: "lead_time_todoist_sync", label: "Tasks sync" },
  { jobName: "post_trip_review_prompt", label: "Review prompt" },
];

function fmtSyncTime(d) {
  return new Date(d).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function renderSyncStatus(rows) {
  if (!els.syncStatus) return;
  if (!rows) {
    els.syncStatus.hidden = true;
    return;
  }

  // rows are ordered newest-first; keep only the first (most recent) row
  // seen per job name.
  const latestByJob = new Map();
  for (const row of rows) {
    if (!latestByJob.has(row.job_name)) latestByJob.set(row.job_name, row);
  }

  const parts = SYNC_JOBS.map(({ jobName, label }) => {
    const row = latestByJob.get(jobName);
    if (!row) {
      return `<span class="job warn">${label}: never run</span>`;
    }
    const ageMs = new Date() - new Date(row.run_at);
    const stale = ageMs > 36 * 60 * 60 * 1000;
    const failed = row.status && row.status !== "success";
    const warn = stale || failed;
    const note = failed ? ` (${row.status})` : stale ? " (stale)" : "";
    return `<span class="job ${warn ? "warn" : "ok"}">${label} ${fmtSyncTime(row.run_at)} ${warn ? "⚠" : "✓"}${note}</span>`;
  });

  els.syncStatus.innerHTML = parts.join("");
  els.syncStatus.hidden = false;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function formatInlineBold(s) {
  // The AI's output (and this file's own trip-detail copy) uses **bold** for
  // emphasis — turn that into <strong> after escaping.
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

// ---- 7-day week grid -----------------------------------------------------
// Draws raw_data.weekGrid (built by the daily-brief-lite function). Pink =
// anything Tim is involved in, green = OPEN, blue = out of town, yellow =
// family event not involving him (evenings). Hidden if the brief predates
// the grid, so an older saved brief still renders normally.
function renderWeekGrid(g) {
  if (!g || !Array.isArray(g.days) || !g.days.length) return "";
  const PXH = 17, EPXH = 26;
  const dy = (m) => (Math.max(g.dayStart, Math.min(m, g.dayEnd)) - g.dayStart) / 60 * PXH;
  const ey = (m) => (m - g.eveStart) / 60 * EPXH;
  const dh = (g.dayEnd - g.dayStart) / 60 * PXH;
  const eh = (g.eveEnd - g.eveStart) / 60 * EPXH;
  const hr = (h) => (h > 12 ? h - 12 : h) + (h < 12 ? "a" : "p");
  const segHtml = (sg, top, height, extra) =>
    `<div class="wg-seg ${sg.t}${sg.lanes > 1 ? " multi" : ""}" title="${escapeHtml((sg.label || "") + " " + (sg.time || "")).trim()}" style="top:${top}px;height:${height}px;${extra || ""}">${sg.label ? escapeHtml(sg.label) : ""}${sg.time ? "<span>" + escapeHtml(sg.time) + "</span>" : ""}</div>`;
  let h = '<div class="wg"><div class="wg-grid"><div></div>';
  h += g.days.map((d) => `<div class="wg-hd${d.isToday ? " today" : ""}">${escapeHtml(d.dow)}<b>${d.dom}</b></div>`).join("");
  let ax = "";
  for (let t = Math.ceil(g.dayStart / 60 / 2) * 2; t <= g.dayEnd / 60; t += 2) ax += `<span style="top:${dy(t * 60)}px">${hr(t)}</span>`;
  h += `<div class="wg-axis" style="height:${dh}px">${ax}</div>`;
  h += g.days.map((d) => `<div class="wg-col" style="height:${dh}px">${d.day.map((sg) => {
    const top = dy(sg.s), height = dy(sg.e) - top;
    return height > 0 ? segHtml(sg, top, height) : "";
  }).join("")}</div>`).join("");
  h += '<div class="wg-sep"></div>';
  let ex = "";
  for (let t = g.eveStart / 60; t <= g.eveEnd / 60; t++) ex += `<span style="top:${ey(t * 60)}px">${hr(t)}</span>`;
  h += `<div class="wg-axis" style="height:${eh}px">${ex}</div>`;
  h += g.days.map((d) => `<div class="wg-ecol" style="height:${eh}px">${d.eve.map((sg) => {
    const lanes = sg.lanes || 1, lane = sg.lane || 0;
    const w = 100 / lanes;
    const top = ey(sg.s), height = Math.max(ey(sg.t === "away" ? g.eveEnd : sg.e) - top, 12);
    return segHtml(sg, top, height, `left:${lane * w}%;right:${100 - (lane + 1) * w}%;`);
  }).join("")}</div>`).join("");
  h += '</div><div class="wg-legend">' +
    '<span><i style="background:#2e9e66"></i>OPEN</span>' +
    '<span><i style="background:#f6d3d5"></i>You\'re involved</span>' +
    '<span><i style="background:#f6d86a"></i>Family (not you)</span>' +
    '<span><i style="background:#5b9bd5"></i>Out of town</span>' +
    '</div></div>';
  return h;
}

// Parses the brief's plain-text bullet format (see the Edge Function's
// phraseWithClaude prompt) into real markup: a headline, "## " section
// labels, and "- " bullets with **bold** titles.
function renderBriefBullets(raw, gridHtml) {
  const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  let html = "";
  let inList = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };

  for (const line of lines) {
    if (line.startsWith("## ")) {
      closeList();
      html += `<div class="brief-section">${escapeHtml(line.slice(3))}</div>`;
      if (gridHtml && line.slice(3).trim() === "Week ahead") html += gridHtml;
    } else if (line.startsWith("- ")) {
      if (!inList) { html += '<ul class="brief-list">'; inList = true; }
      html += `<li>${formatInlineBold(line.slice(2))}</li>`;
    } else {
      closeList();
      html += `<div class="brief-headline">${formatInlineBold(line)}</div>`;
    }
  }
  closeList();
  return html;
}

function renderBrief(brief) {
  if (!brief) {
    els.briefCard.hidden = true;

  els.briefDate.textContent = new Date().toLocaleDateString(undefined, {

  els.briefText.innerHTML = renderBriefBullets(brief.brief_text, renderWeekGrid(brief.raw_data?.weekGrid));
  const { text, stale } = fmtBriefTimestamp(brief.generated_at, brief.raw_data?.date);
  els.briefGenerated.textContent = stale ? `${text} — this may be out of date` : text;
  els.briefGenerated.className = stale ? "brief-stale" : "";
  els.briefCard.hidden = false;
}

let allTrips = [];
let currentTrip = null;

function colorStyle(color) {
  if (!color) return "";
  return `style="--tclr:${color.c};--tclr-dark:${color.d};--tclr-soft:${color.s}"`;
}

function statusLabel(status) {
  return { booked: "✓ Booked", requested: "◐ Requested", open: "○ Open", flag: "⚠ Flag", info: "Info" }[status] || (status || "");
}

function pillHtml(chip) {
  const cls = { booked: "pill-booked", requested: "pill-requested", open: "pill-open", flag: "pill-flag", info: "pill-info" }[chip.type] || "pill-open";
  return `<span class="pill ${cls}">${escapeHtml(chip.label)}</span>`;
}

function chipHtml(chip) {
  const cls = { booked: "chip-done", requested: "chip-requested", open: "chip-open", flag: "chip-flag", info: "chip-open" }[chip.type] || "chip-open";
  return `<span class="chip ${cls}">${escapeHtml(chip.label)}</span>`;
}

function daysUntil(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const target = new Date(y, m - 1, d);
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.max(0, Math.ceil((target - now) / 86400000));
}

function renderMiniCard(trip, faded) {

// ---- ADR-9: trip status is derived from dates on every load ----------------
// category === 'someday' is the only manual override (undated ideas).
// 'archived' is still honored as past, for trips hand-archived before ADR-9.
function todayLocalStr() {
  const n = new Date();
  const p = (x) => String(x).padStart(2, "0");
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
}

function tripStatus(t, today) {
  if (t.category === "someday") return "someday";
  if (t.category === "archived") return "past";
  const start = t.start_date;
  const end = t.end_date || t.start_date;
  if (!start) return "future"; // undated, not marked someday: keep visible, sorted last
  if (end < today) return "past";
  if (start <= today) return "current";
  return "future";
}

const tripReviewCache = {}; // trip_id -> review row | null

function plainText(s) {
  return String(s || "").replace(/\*\*/g, "");
}

// ADR-10: every captured record shows where it stands — captured (saved in
// Helm only), filed (also written into the Second Brain), or failed.
function recordStatusHtml(r) {
  if (!r) return "";
  const st = ["captured", "filed", "failed"].includes(r.status) ? r.status : "captured";
  const label = st === "filed" ? "Filed in Second Brain" : st === "failed" ? "Filing failed" : "Captured · not yet filed";
  return `<div style="margin-top:8px"><span class="rec-status ${st}">${label}</span></div>`;
}

function renderPastCard(trip) {
  const d = trip.detail || {};
  const s = (d.sections) || {};
  const endYear = trip.end_date ? trip.end_date.slice(0, 4) : "";
  const lodging = s.lodging && (s.lodging.paragraphs || []).length ? plainText(s.lodging.paragraphs[0]) : "";
  const dining = ((s.dining && s.dining.entries) || [])
    .filter((e) => e.title)
    .map((e) => e.title);
  return `
    <div class="past-card" data-past-id="${trip.id}">
      <button type="button" class="past-head" aria-expanded="false">
        <span>
          <span class="past-title">${d.icon || "🧭"} ${escapeHtml(trip.destination || trip.name)}</span>
          <span class="past-dates" style="display:block">${fmtCardDate(trip.start_date)} – ${fmtCardDate(trip.end_date)}${endYear ? ", " + endYear : ""}</span>
        </span>
        <span class="past-chevron">&#9662;</span>
      </button>
      ${lodging ? `<div class="past-line"><b>Hotel</b>${escapeHtml(lodging)}</div>` : ""}
      ${dining.length ? `<div class="past-line"><b>Restaurants</b>${dining.map(escapeHtml).join(" · ")}</div>` : ""}
      <div class="past-review" hidden></div>
    </div>`;
}

function renderStatsBar(ahead, current, someday, past) {
  const next = ahead[0];
  els.travelStats.innerHTML = `
    <div class="stat-card"><div class="stat-label">Trips ahead</div><div class="stat-value">${ahead.length}</div></div>
    <div class="stat-card"><div class="stat-label">Next departure</div><div class="stat-value">${next && next.start_date ? daysUntil(next.start_date) : "—"}</div><div class="stat-sub">${next ? "days · " + escapeHtml(next.destination || next.name) : (current.length ? "A trip is underway" : "Nothing scheduled")}</div></div>
    <div class="stat-card"><div class="stat-label">Someday ideas</div><div class="stat-value">${someday.length}</div></div>
    <div class="stat-card"><div class="stat-label">Past trips</div><div class="stat-value">${past.length}</div></div>`;
}

async function loadTravelList() {
  const { data: trips, error } = await sb
    .from("trips")
    .select("*")
    .order("start_date", { ascending: true, nullsFirst: false });

  if (error) {
    els.travelUpcoming.innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }

  allTrips = trips || [];
  const today = todayLocalStr();
  const byStart = (a, b) => (a.start_date || "9999-99-99").localeCompare(b.start_date || "9999-99-99");

  const current = allTrips.filter((t) => tripStatus(t, today) === "current").sort(byStart);
  const ahead = allTrips.filter((t) => tripStatus(t, today) === "future").sort(byStart);
  const someday = allTrips.filter((t) => tripStatus(t, today) === "someday");
  const past = allTrips
    .filter((t) => tripStatus(t, today) === "past")
    .sort((a, b) => (b.end_date || b.start_date || "").localeCompare(a.end_date || a.start_date || ""));

  renderStatsBar(ahead, current, someday, past);

  els.travelCurrentWrap.hidden = current.length === 0;
  els.travelCurrent.innerHTML = current.map((t) => renderTripCard(t, "current")).join("");

  els.travelUpcoming.innerHTML = ahead.length
    ? ahead.map((t, i) => renderTripCard(t, i === 0 ? "next" : "")).join("")
    : `<div class="empty">No upcoming trips yet.</div>`;
  els.travelSomeday.innerHTML = someday.length
    ? someday.map((t) => renderMiniCard(t)).join("")
    : `<div class="empty">Nothing parked yet.</div>`;
  els.travelArchive.innerHTML = past.length
    ? past.map(renderPastCard).join("")
    : `<div class="empty">No past trips logged yet.</div>`;

  // Saved reviews for past trips, fetched once so expanding a card is instant.
  if (past.length) {
    const ids = past.map((t) => t.id);
    const { data: reviews, error: rErr } = await sb.from("trip_reviews").select("*").in("trip_id", ids).order("created_at", { ascending: false });
    if (!rErr) {
      ids.forEach((id) => { tripReviewCache[id] = null; });
      (reviews || []).forEach((r) => { if (!tripReviewCache[r.trip_id]) tripReviewCache[r.trip_id] = r; });
    }
  }
}

function openTripCardFromEvent(e) {
  const card = e.target.closest("[data-trip-id]");
  if (card) openTripDetail(card.dataset.tripId);
}
els.travelUpcoming.addEventListener("click", openTripCardFromEvent);
els.travelUpcoming.addEventListener("keydown", (e) => { if (e.key === "Enter") openTripCardFromEvent(e); });
els.travelCurrent.addEventListener("click", openTripCardFromEvent);
els.travelCurrent.addEventListener("keydown", (e) => { if (e.key === "Enter") openTripCardFromEvent(e); });

// Past trips: tap the header to expand/collapse the saved review; "Full trip detail" opens the normal detail view.
els.travelArchive.addEventListener("click", (e) => {
  const open = e.target.closest(".past-open");
  const card = e.target.closest("[data-past-id]");
  if (!card) return;
  if (open) { openTripDetail(card.dataset.pastId); return; }
  if (!e.target.closest(".past-head")) return;

  const box = card.querySelector(".past-review");
  const head = card.querySelector(".past-head");
  const willOpen = box.hidden;
  if (willOpen) {
    const r = tripReviewCache[card.dataset.pastId];
    const returnLine = r && r.would_return === true ? "You said you'd go back."
      : r && r.would_return === false ? "You said you wouldn't go back." : "";
    box.innerHTML = (r
      ? `${r.review_notes ? `<div>${escapeHtml(r.review_notes)}</div>` : ""}${returnLine ? `<div class="field-sub" style="margin-top:6px">${returnLine}</div>` : ""}${recordStatusHtml(r)}`
      : `<div class="field-sub">No review saved yet.</div>`)
      + `<button type="button" class="past-open">Full trip detail &rarr;</button>`;
  }
  box.hidden = !willOpen;
  head.setAttribute("aria-expanded", String(willOpen));
});

function renderCharterOptions(opts, note) {
  if (!opts || !opts.length) return "";
  const cards = opts.map((o) => `
    <div class="option${o.style === "reco" ? " reco" : ""}">
      <h3><span>${escapeHtml(o.title)}${o.badge ? `<span class="reco-badge">${escapeHtml(o.badge)}</span>` : ""}</span>${o.price ? `<span class="price">${escapeHtml(o.price)}</span>` : ""}</h3>

// ---- Dining (ADR-10, second capture domain) -------------------------------
// Same shape as trip reviews: saving writes to Supabase at once (status
// "captured"); a Claude session later files it into the Second Brain and marks
// it "filed". Editing a filed row flips it back to captured so it gets re-filed.
// Cuisine -> color + icon. Matches on keywords in whatever was typed (the earliest
// keyword in the text wins, so "Thai / Sushi" reads as Thai). Anything unrecognized
// still gets a stable color derived from its text, so it never looks unstyled.
const CUISINES = [
  { re: /indian|curry|tandoor/, h: 28, e: "🍛" },
  { re: /sushi|japanese|ramen|izakaya|hibachi/, h: 350, e: "🍣" },
  { re: /thai/, h: 145, e: "🍜" },
  { re: /vietnam|pho\b|banh/, h: 168, e: "🍲" },
  { re: /chinese|dim sum|szechuan|sichuan|cantonese/, h: 6, e: "🥟" },
  { re: /korean|bulgogi|bibimbap/, h: 322, e: "🥢" },
  { re: /pizza/, h: 16, e: "🍕" },
  { re: /italian|pasta|trattoria/, h: 98, e: "🍝" },
  { re: /french|bistro|brasserie/, h: 258, e: "🥐" },
  { re: /mexican|taco|tex-mex|cantina/, h: 46, e: "🌮" },
  { re: /seafood|oyster|\bfish\b|crab|lobster|raw bar/, h: 197, e: "🦞" },
  { re: /bbq|barbecue|smokehouse|\bbarbeque/, h: 12, e: "🍖" },
  { re: /mediterranean|greek|lebanese|middle eastern|turkish|croatian|falafel/, h: 176, e: "🫒" },
  { re: /american|burger|steak|southern|diner|grill|contemporary/, h: 214, e: "🍔" },
  { re: /breakfast|brunch|bakery|cafe|coffee|donut/, h: 52, e: "🥞" },
  { re: /pub|\bbar\b|brewery|tavern|cocktail|wine/, h: 285, e: "🍺" },
];
function cuisineInfo(text) {
  const t = String(text || "").toLowerCase().trim();
  if (!t) return null;
  let best = null, bestIdx = Infinity;
  CUISINES.forEach((c) => {
    const m = t.search(c.re);
    if (m >= 0 && m < bestIdx) { best = c; bestIdx = m; }
  });
  if (best) return { h: best.h, e: best.e, key: best.h + ":" + best.e };
  let hash = 0;
  for (let i = 0; i < t.length; i++) hash = (hash * 31 + t.charCodeAt(i)) >>> 0;
  return { h: hash % 360, e: "🍽️", key: "x:" + t };
}

function httpUrl(u) {
  if (!u) return null;
  const t = u.trim();
  if (/^https?:\/\//i.test(t)) return t;
  if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return null; // no javascript:, data:, etc.
  return "https://" + t;
}
function reserveHtml(r) {
  const t = r.reservation_type;
  if (!t) return "";
  const phoneDigits = r.phone ? r.phone.replace(/[^\d+]/g, "") : "";
  const link = (href, label) => `<a class="din-reserve" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  if (t === "opentable") {
    const href = httpUrl(r.reservation_url) || "https://www.opentable.com/s?term=" + encodeURIComponent(r.name + (r.place && r.scope !== "trip" ? " " + r.place.split(" /")[0] : ""));
    return link(href, "Reserve on OpenTable" + (r.reservation_url ? "" : " (search)"));
  }
  if (t === "resy") {
    const href = httpUrl(r.reservation_url);
    return href ? link(href, "Reserve on Resy") : `<span class="din-reserve off">Reserves on Resy &middot; link will be filled in</span>`;
  }
  if (t === "website") {
    const href = httpUrl(r.reservation_url) || httpUrl(r.website);
    return href ? link(href, "Reserve on their website") : `<span class="din-reserve off">Reserves on their website &middot; link will be filled in</span>`;
  }
  if (t === "phone") {
    return r.phone
      ? `<a class="din-reserve" href="tel:${escapeHtml(phoneDigits)}">Call to reserve &middot; ${escapeHtml(r.phone)}</a>`
      : `<span class="din-reserve off">Call to reserve &middot; number will be filled in</span>`;
  }
  return "";
}

function contactHtml(r) {
  const safeUrl = httpUrl(r.website);
  const phoneDigits = r.phone ? r.phone.replace(/[^\d+]/g, "") : "";
  const bits = [];
  if (r.phone) bits.push(`<a href="tel:${escapeHtml(phoneDigits)}">${escapeHtml(r.phone)}</a>`);
  if (safeUrl) bits.push(`<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">Website</a>`);
  const missing = !r.address || !r.phone || !r.reservation_type;
  return (bits.length ? `<div class="din-line din-contact">${bits.join(" &middot; ")}</div>` : "")
    + reserveHtml(r)
    + (missing && r.status === "captured" ? `<div class="din-line din-pending">Address, phone and reservation info will be filled in automatically</div>` : "");
}

  }
  const cz = cuisineInfo(r.cuisine);
  const sub = [r.occasion ? OCCASION_LABEL[r.occasion] : null, r.address].filter(Boolean).map(escapeHtml).join(" · ");
  const chips = (r.verdict ? `<span class="din-verdict ${r.verdict}">${VERDICT_LABEL[r.verdict]}</span>` : "")
    + (r.would_return ? `<span class="field-sub">${WOULD_RETURN_LABEL[r.would_return]}</span>` : "");
  const line = (label, v) => (v ? `<div class="din-line"><b>${label}</b>${escapeHtml(v)}</div>` : "");
  return `
    <div class="din-card" data-rid="${r.id}" style="--cz-h:${cz ? cz.h : 210}">
      <div class="din-name">${escapeHtml(r.name)}</div>
      ${cz ? `<div class="din-cz-row"><span class="din-cz">${cz.e} ${escapeHtml(r.cuisine)}</span></div>` : ""}
      ${sub ? `<div class="din-sub">${sub}</div>` : ""}
      ${chips ? `<div style="margin-top:7px">${chips}</div>` : ""}
      ${line("Standout dish", r.standout_dish)}
      ${line("Gluten-free", r.gf_note)}
      ${line("Dairy-free", r.df_note)}
      ${line("Notes", r.notes)}
      ${r.recommended_by ? line("Recommended by", r.recommended_by) : ""}
      ${contactHtml(r)}
      ${recordStatusHtml(r)}
      <button type="button" class="din-edit">Edit</button>
    </div>`;
}

function renderCuisineFilters(baseRows) {
  const seen = new Map();
  baseRows.forEach((r) => {
    const c = cuisineInfo(r.cuisine);
    if (c && !seen.has(c.key)) seen.set(c.key, { c, label: r.cuisine, n: 0 });
    if (c) seen.get(c.key).n++;
  });
  if (diningCuisine && !seen.has(diningCuisine)) diningCuisine = null;
  if (seen.size < 2) { dinEls.cfilters.innerHTML = ""; return; }
  dinEls.cfilters.innerHTML = [...seen.entries()].map(([key, v]) =>
    `<button type="button" class="din-cfilter${diningCuisine === key ? " active" : ""}" data-ckey="${escapeHtml(key)}" style="--cz-h:${v.c.h}">${v.c.e} ${escapeHtml(v.label)} <span style="opacity:.7">${v.n}</span></button>`
  ).join("");
}
dinEls.cfilters.addEventListener("click", (e) => {
  const b = e.target.closest(".din-cfilter");
  if (!b) return;
  diningCuisine = diningCuisine === b.dataset.ckey ? null : b.dataset.ckey; // tap again to clear
  renderDining();
});

// ---- Search: every word must match something about the restaurant (AND). ----
const RES_LABEL = { opentable: "opentable reserve reservation online", resy: "resy reserve reservation online", website: "reserve reservation online website", phone: "call phone reserve reservation" };
function diningHaystack(r) {
  const parts = [
    r.name, r.cuisine, r.address, r.place, r.standout_dish, r.notes, r.recommended_by, r.gf_note, r.df_note,
    r.occasion === "special" ? "special occasion fancy date night" : r.occasion === "everyday" ? "everyday casual regular" : "",
    r.tried === false ? "want to try recommended new" : "",
    r.verdict === "like" ? "like liked favorite favourite good" : r.verdict === "dislike" ? "dislike disliked avoid" : r.verdict === "neutral" ? "neutral ok" : "",
    r.would_return === "yes" ? "would return" : r.would_return === "no" ? "would not return avoid" : "",
    r.scope === "trip" ? "trip travel" : "local home",
    RES_LABEL[r.reservation_type] || "",
    r.phone ? "phone" : "",
    r.website ? "website" : "",
  ];
  // Words that mean "handles our dietary needs" only match when we have a note for them.
  if (r.gf_note) parts.push("gluten free gluten-free gf celiac");
  if (r.df_note) parts.push("dairy free dairy-free df lactose");
  return parts.filter(Boolean).join(" ").toLowerCase();
}
function matchesQuery(r, q) {
  const terms = q.toLowerCase().split(/[\s,]+/).filter((t) => t && !/^(and|or|the|a|in|near|nearby|for|to|restaurants?|places?)$/.test(t));
  if (!terms.length) return true;
  const hay = diningHaystack(r);
  return terms.every((t) => hay.includes(t));
}
const dinSearchEl = document.getElementById("din-search");
const dinSearchClear = document.getElementById("din-search-clear");
const dinSearchNote = document.getElementById("din-search-note");
dinSearchEl.addEventListener("input", () => {
  diningQuery = dinSearchEl.value;
  dinSearchClear.hidden = !diningQuery;
  renderDining();
});
dinSearchClear.addEventListener("click", () => {
  dinSearchEl.value = ""; diningQuery = ""; dinSearchClear.hidden = true; renderDining(); dinSearchEl.focus();
});

function renderDining() {
  const baseRows = allRestaurants.filter((r) => {
    if (diningFilter === "all") return true;
    if (diningFilter === "try") return r.tried === false;
    if (diningFilter === "trip") return r.scope === "trip" && r.tried !== false;
    return r.tried !== false && r.scope === "local" && r.occasion === diningFilter;
  });
  renderCuisineFilters(baseRows);
  const byCuisine = diningCuisine ? baseRows.filter((r) => { const c = cuisineInfo(r.cuisine); return c && c.key === diningCuisine; }) : baseRows;
  const q = diningQuery.trim();
  const rows = q ? byCuisine.filter((r) => matchesQuery(r, q)) : byCuisine;
  dinSearchNote.hidden = !q;
  if (q) dinSearchNote.textContent = rows.length === 1 ? "1 match" : rows.length + " matches";
  if (!rows.length) {
    dinEls.list.innerHTML = `<div class="empty">${allRestaurants.length ? (q ? "Nothing matches “" + escapeHtml(q) + "”." : "Nothing matches that filter.") : "No restaurants yet — add the first one."}</div>`;
    return;
  }
  // Auto-filing: anywhere we disliked or would not return drops to a collapsed list at the bottom.
  const isAvoid = (r) => r.tried !== false && (r.verdict === "dislike" || r.would_return === "no");
  const mainRows = rows.filter((r) => !isAvoid(r));
  const avoidRows = rows.filter(isAvoid);
  const groupOf = (r) => (r.tried === false ? "Want to try" : r.scope === "trip" ? "From trips" : r.place || "Local");
  const groups = {};
  mainRows.forEach((r) => { (groups[groupOf(r)] = groups[groupOf(r)] || []).push(r); });
  const order = ["Raleigh / Research Triangle", "Ocean Isle Beach"];
  const keys = Object.keys(groups).sort((a, b) => {
    const rank = (k) => (order.indexOf(k) >= 0 ? order.indexOf(k) : k === "Want to try" ? 10 : k === "From trips" ? 99 : 50);
    return rank(a) - rank(b) || a.localeCompare(b);
  });
  const occRank = { everyday: 0, special: 1 };
  const mainHtml = keys.map((k) => {
    const items = groups[k].slice().sort((a, b) =>
      (occRank[a.occasion] ?? 2) - (occRank[b.occasion] ?? 2) || a.name.localeCompare(b.name));
    return `<div class="din-group">${escapeHtml(k)}</div>` + items.map(renderDiningCard).join("");
  }).join("");
  const avoidHtml = avoidRows.length
    ? `<details class="din-avoid" id="din-avoid"${diningAvoidOpen ? " open" : ""}><summary>Would not return / disliked &middot; ${avoidRows.length}</summary>`
      + avoidRows.slice().sort((a, b) => a.name.localeCompare(b.name)).map(renderDiningCard).join("") + `</details>`
    : "";
  dinEls.list.innerHTML = mainHtml + avoidHtml;
  const av = document.getElementById("din-avoid");
  if (av) av.addEventListener("toggle", () => { diningAvoidOpen = av.open; });
}

dinEls.list.addEventListener("click", (e) => {
  const btn = e.target.closest(".din-edit");
  if (!btn) return;
  const card = e.target.closest("[data-rid]");
  const row = allRestaurants.find((r) => r.id === card.dataset.rid);
  if (row) { openDiningForm(row, null, { markTried: btn.classList.contains("din-went") }); dinEls.form.scrollIntoView({ behavior: "smooth", block: "start" }); }
});

async function loadDining() {
  const { data, error } = await sb.from("restaurants").select("*").order("name", { ascending: true });
  if (error) {
    // Best-effort, like the brief: a missing table must never break the other tabs.
    dinEls.list.innerHTML = `<div class="empty">Dining isn't available yet: ${escapeHtml(error.message)}</div>`;
    dinEls.addBtn.hidden = true;
    return;
  }
  dinEls.addBtn.hidden = false;
  allRestaurants = data || [];
  renderDining();
}

dinEls.saveBtn.addEventListener("click", async () => {
  const name = dinEls.name.value.trim();
  if (!name) {
    dinEls.savedNote.textContent = "Add a name first.";
    dinEls.savedNote.hidden = false;
    return;
  }
  dinEls.saveBtn.disabled = true;
  dinEls.savedNote.hidden = true;

  const { data: { user } } = await sb.auth.getUser();
  const isTrip = dinEls.place.value === "trip";
  const tripRow = isTrip ? (allTrips || []).find((t) => t.id === dinEls.trip.value) : null;
  const want = dinState.tried === "no";
  const payload = {
    owner_id: user.id,
    name,
    tried: !want,
    recommended_by: dinEls.recBy.value.trim() || null,
    scope: isTrip ? "trip" : "local",
    place: isTrip ? (tripRow ? (tripRow.destination || tripRow.name) : null)
      : (dinEls.place.value === "oib" ? "Ocean Isle Beach" : "Raleigh / Research Triangle"),
    trip_id: isTrip && tripRow ? tripRow.id : null,
    address: dinEls.address.value.trim() || null,
    phone: dinEls.phone.value.trim() || null,
    website: dinEls.website.value.trim() || null,
    reservation_type: dinState.reservation || null,
    reservation_url: dinEls.resurl.value.trim() || null,
    cuisine: dinEls.cuisine.value.trim() || null,
    occasion: dinState.occasion,
    verdict: want ? null : dinState.verdict,
    would_return: want ? null : dinState.would_return,
    standout_dish: want ? null : dinEls.dish.value.trim() || null,
    gf_note: want ? null : dinEls.gf.value.trim() || null,
    df_note: want ? null : dinEls.df.value.trim() || null,
    notes: dinEls.notes.value.trim() || null,
    status: "captured", // new or edited: the Second Brain copy needs (re)filing
    updated_at: new Date().toISOString(),
  };

  const { error } = editingRestaurantId
    ? await sb.from("restaurants").update(payload).eq("id", editingRestaurantId)
    : await sb.from("restaurants").insert(payload);

  dinEls.saveBtn.disabled = false;
  if (error) {
    dinEls.savedNote.textContent = "Could not save: " + error.message;
    dinEls.savedNote.hidden = false;
    return;
  }
  closeDiningForm();
  await loadDining();
});

// ---- Destination ideas (ADR-10 third capture domain) -----------------------
// Captured in Helm, filed into Areas/Travel/03_Future-Travel-Ideas.md by a
// Claude session (Standards §6 Helm sweep). Audience is multi-select.
const AUDIENCE_LABEL = { family: "Family", couple: "Just us two", friends: "With friends" };
let allIdeas = [];
let ideaFilter = "all";
let editingIdeaId = null;
let ideaAudience = [];
const ideaEls = {
  addBtn: document.getElementById("idea-add-btn"),
  form: document.getElementById("idea-form"),
  title: document.getElementById("idea-form-title"),
  name: document.getElementById("idea-name"),
  region: document.getElementById("idea-region"),
  why: document.getElementById("idea-why"),
  best: document.getElementById("idea-best"),
  recBy: document.getElementById("idea-recby"),
  aud: document.getElementById("idea-audience"),
  save: document.getElementById("idea-save-btn"),
  cancel: document.getElementById("idea-cancel-btn"),
  note: document.getElementById("idea-saved-note"),
  filters: document.getElementById("idea-filters"),
  list: document.getElementById("idea-list"),
};
function paintIdeaAudience() {
  ideaEls.aud.querySelectorAll("button").forEach((b) => b.classList.toggle("selected", ideaAudience.includes(b.dataset.value)));
}
ideaEls.aud.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const v = b.dataset.value;
  ideaAudience = ideaAudience.includes(v) ? ideaAudience.filter((x) => x !== v) : ideaAudience.concat(v);
  paintIdeaAudience();
});
function openIdeaForm(row) {
  editingIdeaId = row ? row.id : null;
  ideaEls.title.textContent = row ? "Edit destination idea" : "New destination idea";
  ideaEls.name.value = row ? row.name || "" : "";
  ideaEls.region.value = row ? row.region || "" : "";
  ideaEls.why.value = row ? row.why || "" : "";
  ideaEls.best.value = row ? row.best_time || "" : "";
  ideaEls.recBy.value = row ? row.recommended_by || "" : "";
  ideaAudience = row ? (row.audience || []).slice() : [];
  paintIdeaAudience();
  ideaEls.note.hidden = true;
  ideaEls.form.hidden = false;
  ideaEls.name.focus();
}
function closeIdeaForm() {
  ideaEls.form.hidden = true;
  editingIdeaId = null;
}
ideaEls.addBtn.addEventListener("click", () => openIdeaForm(null));
ideaEls.cancel.addEventListener("click", closeIdeaForm);
ideaEls.filters.addEventListener("click", (e) => {
  const btn = e.target.closest(".din-filter");
  if (!btn) return;
  ideaFilter = btn.dataset.filter;
  ideaEls.filters.querySelectorAll(".din-filter").forEach((b) => b.classList.toggle("active", b === btn));
  renderIdeas();
});
function renderIdeaCard(r) {
  const line = (label, v) => (v ? `<div class="din-line"><b>${label}</b>${escapeHtml(v)}</div>` : "");
  const aud = (r.audience || []).map((a) => `<span class="din-verdict try">${escapeHtml(AUDIENCE_LABEL[a] || a)}</span>`).join(" ");
  return `
    <div class="din-card" data-iid="${r.id}">
      <div class="din-name">${escapeHtml(r.name)}</div>
      ${r.region ? `<div class="din-sub">${escapeHtml(r.region)}</div>` : ""}
      ${aud ? `<div style="margin-top:7px">${aud}</div>` : ""}
      ${line("Why", r.why)}
      ${line("Best time", r.best_time)}
      ${line("Recommended by", r.recommended_by)}
      ${recordStatusHtml(r)}
      <button type="button" class="din-edit">Edit</button>
    </div>`;
}
function renderIdeas() {
  ideaEls.filters.hidden = allIdeas.length === 0;
  const rows = allIdeas.filter((r) => ideaFilter === "all" || (r.audience || []).includes(ideaFilter));
  ideaEls.list.innerHTML = rows.length
    ? rows.map(renderIdeaCard).join("")
    : (allIdeas.length ? `<div class="empty">Nothing under that filter.</div>` : "");
}
ideaEls.list.addEventListener("click", (e) => {
  if (!e.target.closest(".din-edit")) return;
  const card = e.target.closest(".din-card");
  const row = allIdeas.find((r) => r.id === card.dataset.iid);
  if (row) { openIdeaForm(row); ideaEls.form.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
async function loadIdeas() {
  const { data, error } = await sb.from("destination_ideas").select("*").order("created_at", { ascending: false });
  if (error) {
    // Best-effort: a missing table must never break the other tabs.
    ideaEls.list.innerHTML = `<div class="empty">Ideas aren't available yet: ${escapeHtml(error.message)}</div>`;
    ideaEls.addBtn.hidden = true;
    return;
  }
  ideaEls.addBtn.hidden = false;
  allIdeas = data || [];
  renderIdeas();
}
ideaEls.save.addEventListener("click", async () => {
  const name = ideaEls.name.value.trim();
  if (!name) {
    ideaEls.note.textContent = "Add a place first.";
    ideaEls.note.hidden = false;
    return;
  }
  ideaEls.save.disabled = true;
  ideaEls.note.hidden = true;
  const { data: { user } } = await sb.auth.getUser();
  const payload = {
    owner_id: user.id,
    name,
    region: ideaEls.region.value.trim() || null,
    why: ideaEls.why.value.trim() || null,
    best_time: ideaEls.best.value.trim() || null,
    recommended_by: ideaEls.recBy.value.trim() || null,
    audience: ideaAudience,
    status: "captured", // new or edited: the Second Brain copy needs (re)filing
    updated_at: new Date().toISOString(),
  };
  const { error } = editingIdeaId
    ? await sb.from("destination_ideas").update(payload).eq("id", editingIdeaId)
    : await sb.from("destination_ideas").insert(payload);
  ideaEls.save.disabled = false;
  if (error) {
    ideaEls.note.textContent = "Could not save: " + error.message;
    ideaEls.note.hidden = false;
    return;
  }
  closeIdeaForm();
  await loadIdeas();
});

async function showApp() {
  els.signin.hidden = true;
  els.app.hidden = false;
  await Promise.all([loadTravelList(), loadBriefAndSync()]);
  await loadDining(); // after trips load, so the trip picker has its list
  await loadIdeas();
}

function showSignin(message) {
  els.app.hidden = true;
  els.signin.hidden = false;
  els.signinError.textContent = message || "";
}

els.signinForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  els.signinBtn.disabled = true;
  els.signinError.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({ email, password });
  els.signinBtn.disabled = false;

  if (error) {
    els.signinError.textContent = error.message;
    return;
  }
  await showApp();
});

els.signoutBtn.addEventListener("click", async () => {
  await sb.auth.signOut();
  showSignin();
});

// On load, pick up an existing session (so you're not asked to sign in every
// single time you open the page — Supabase keeps the session in the browser).
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await showApp();
  }
})();
</script>
