<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Helm</title>

<!-- Installable on your phone home screen: add-to-home-screen works from any browser
     without needing a separate manifest file for this first version. -->

<style>
  :root {
    color-scheme: light;
    --bg: #f4f7f6;
    --panel: #ffffff;
    --panel-border: #e2e8e5;
    --text: #16302d;
    --muted: #66766f;
    --accent: #2f6fbd;
    --booked: #1f6b3d;
    --pending: #8a5a00;
    --unverified: #9a3412;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }

  /* ---- Sign-in screen ---- */
  #signin { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  #signin h1 { font-size: 20px; margin-bottom: 4px; }
  #signin p.sub { color: var(--muted); font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  #signin label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  #signin input {
    width: 100%; padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border); background: var(--panel); color: var(--text);
    font-size: 16px;
  }
  #signin button {
    width: 100%; margin-top: 22px; padding: 12px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #signin button:disabled { opacity: 0.5; }
  #signin .error { color: #b3401f; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---- Trip screen ---- */
  header.trip { margin-bottom: 20px; }
  header.trip h1 { font-size: 22px; margin: 0 0 2px; }
  header.trip .dest { color: var(--muted); font-size: 14px; }
  header.trip .dates { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .status-pill {
    display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: #223; color: var(--muted); margin-top: 8px; text-transform: capitalize;
  }

  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 28px 0 10px; }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 13px 14px; margin-bottom: 10px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge.booked { background: #dff2e6; color: #1f6b3d; }
  .badge.pending { background: #ffedc2; color: #8a5a00; }
  .badge.unverified { background: #fde3d6; color: #9a3412; }
  .badge.optional { background: #eef1ef; color: var(--muted); }
  .badge.open { background: #ffedc2; color: #8a5a00; }
  .badge.done { background: #dff2e6; color: #1f6b3d; }

  .card-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card-when { color: var(--text); font-size: 13px; margin-top: 6px; }
  .card-prov { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .provenance {
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--panel-border);
    font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  /* ---- Top-level nav: Today / Travel ---- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .brand { font-size: 18px; font-weight: 700; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 9px; padding: 3px; }
  .tab-btn { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .view[hidden] { display: none; }

  /* ---- Today (brief) view ---- */
  .brief-card { margin-bottom: 10px; }
  .brief-date { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .brief-headline { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 14px; }
  .brief-section { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 16px 0 8px; }
  .brief-section:first-of-type { margin-top: 0; }
  .brief-list { margin: 0; padding-left: 20px; }
  .brief-list li { margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
  .brief-list li strong { color: var(--text); }
  .brief-stale { color: #8a5a00; }

  /* ---- Sync status (heartbeat) ---- */
  .sync-status {
    margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--panel-border);
    color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap;
  }
  .sync-status .job { display: inline-flex; align-items: center; gap: 5px; }
  .sync-status .ok { color: #1f6b3d; }
  .sync-status .warn { color: #8a5a00; }

  /* ---- Trip memory (resurfaced past review) ---- */
  .memory-card { background: #e3edf7; border: 1px solid var(--accent); }
  .memory-card .memory-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent); margin-bottom: 6px;
  }

  /* ---- Trip review (post-trip memory capture) ---- */
  .review-card textarea {
    width: 100%; min-height: 80px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border); background: var(--bg); color: var(--text);
    font-size: 14px; font-family: inherit; resize: vertical;
  }
  .review-card .would-return { display: flex; gap: 8px; margin: 10px 0; }
  .review-card .would-return button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .review-card .would-return button.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .review-card .save-btn {
    margin-top: 4px; padding: 10px 14px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .review-card .save-btn:disabled { opacity: 0.5; }
  .review-card .saved-note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* =========================================================================
     Travel dashboard — multi-trip list + per-trip detail view.
     Ported from Tim's "Travel Dashboard" artifact and adapted to Helm's dark
     theme (the artifact itself is a light-mode mockup — panels/pills below use
     Helm's existing --panel/--panel-border/--muted rather than its palette,
     while each trip keeps its own gradient color identity via --tclr/-dark/-soft
     set inline per card so new trips added later don't need any CSS changes).
     ========================================================================= */

  /* ---- stats bar ---- */
  .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card { flex: 1; min-width: 130px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 11px 14px; }
  .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
  .stat-value { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---- list sections ---- */
  .list-section { margin-bottom: 26px; }
  .list-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }

  /* ---- trip card grid ---- */
  .trip-grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .trip-grid2 { grid-template-columns: 1fr 1fr; } }
  .trip-card2 { border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--panel-border); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  .trip-card2:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(23,49,47,.14); }
  .trip-card2.next { box-shadow: 0 0 0 2px var(--tclr, var(--accent)); }
  .trip-card2:focus-visible { outline: 2px solid var(--tclr, var(--accent)); outline-offset: 2px; }
  .tc-header { padding: 14px 16px 12px; color: #fff; background: linear-gradient(135deg, var(--tclr-dark, #2a3b6b), var(--tclr, var(--accent))); }
  .tc-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tc-icon { font-size: 18px; }
  .tc-badges { display: flex; gap: 6px; }
  .tc-badge { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 3px 7px; border-radius: 999px; background: rgba(255,255,255,.22); }
  .tc-badge.tc-next { background: #fff; color: var(--tclr-dark, #22345c); }
  .tc-dest { font-size: 17px; font-weight: 800; margin-top: 8px; }
  .tc-dates { margin-top: 4px; }
  .tc-dates span { display: block; font-size: 12.5px; font-weight: 700; opacity: .95; }
  .tc-body { padding: 12px 16px 14px; }
  .tc-people { font-size: 12px; color: var(--muted); }
  .tc-summary { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .tc-chips { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }

  /* ---- status pill system ---- */
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .pill-booked { background: #dff2e6; color: #1f6b3d; }
  .pill-requested { background: #ffedc2; color: #8a5a00; }
  .pill-open { background: #eef1ef; color: #6b7a75; }
  .pill-flag { background: #fde3d6; color: #9a3412; }
  .pill-info { background: #e3edf7; color: #2f5c8a; }

  /* ---- someday / archive mini-cards ---- */
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
  .mini-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 13px 15px; }
  .mini-card.faded { opacity: .65; }
  .mini-icon { font-size: 18px; }
  .mini-title { font-weight: 700; font-size: 13.5px; margin-top: 6px; }
  .mini-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mini-status { font-size: 10.5px; color: var(--accent); font-weight: 700; margin-top: 7px; text-transform: uppercase; letter-spacing: .04em; }

  /* ---- current trip (full width) + past trips (ADR-9) ---- */
  .trip-current { display: grid; grid-template-columns: 1fr; }
  .trip-card2.current { box-shadow: 0 0 0 2px var(--tclr, var(--accent)); }
  .tc-badge.tc-current { background: #fff; color: var(--tclr-dark, #22345c); }
  .past-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .past-list { grid-template-columns: 1fr 1fr; } }
  .past-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 13px 15px; }
  .past-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; background: none; border: none; padding: 0; width: 100%; text-align: left; font-family: inherit; color: inherit; }
  .past-title { font-weight: 700; font-size: 14px; }
  .past-dates { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .past-chevron { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .past-line { font-size: 12.5px; margin-top: 8px; line-height: 1.4; }
  .past-line b { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 1px; }
  .past-review { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--panel-border); font-size: 13px; line-height: 1.45; }
  .past-open { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
  .past-open:hover { text-decoration: underline; }
  .rec-status { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--panel-border); color: var(--muted); }
  .rec-status.filed { color: var(--accent); border-color: var(--accent); }
  .rec-status.failed { color: #b3261e; border-color: #b3261e; }
  .rec-link { font-size: 12.5px; margin-left: 8px; color: var(--accent); font-weight: 700; }

  /* ---- detail view ---- */
  .detail-back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; font-size: 13.5px; cursor: pointer; margin-bottom: 14px; background: none; border: none; padding: 0; font-family: inherit; }
  .detail-back:hover { text-decoration: underline; }
  .hero { color: #fff; border-radius: 16px; padding: 22px; margin-bottom: 18px; background: linear-gradient(135deg, var(--tclr-dark, #2a3b6b), var(--tclr, var(--accent))); }
  .hero .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; font-weight: 700; opacity: .88; }
  .hero h1 { color: #fff; font-size: 1.5rem; line-height: 1.15; margin: 6px 0 3px; }
  .hero .daterange { font-size: .92rem; font-weight: 700; opacity: .95; }
  .hero .hero-subtitle { font-size: .88rem; opacity: .92; margin-top: 6px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .chip { padding: 5px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #fff; }
  .chip-done { background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.36); }
  .chip-requested { background: rgba(255,255,255,.14); border: 1px dashed rgba(255,255,255,.62); }
  .chip-open { background: rgba(255,255,255,.08); border: 1px dashed rgba(255,255,255,.42); }
  .chip-flag { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.6); }

  .detail-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 760px) { .detail-grid { grid-template-columns: 1.4fr .95fr; } }

  .dcard { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px 17px; margin-bottom: 14px; }
  .dcard h2 { font-size: 1.02rem; margin: 0 0 12px; }
  .dcard h3 { font-size: .92rem; margin: 0 0 4px; }
  .dcard p { margin: 6px 0; font-size: 13.5px; line-height: 1.45; }
  .dcard .field-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }

  .flight-visual { margin-bottom: 14px; }
  .flight-visual:last-of-type { margin-bottom: 2px; }
  .flight-leg-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .flight-path { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
  .flight-stop { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; min-width: 46px; }
  .flight-stop-code { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; }
  .flight-stop-time { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; font-weight: 600; }
  .flight-connector { flex: 0 1 70px; display: flex; flex-direction: column; align-items: center; padding: 0 6px; min-width: 40px; margin-top: 7px; }
  .flight-connector-line { width: 100%; height: 2px; background: var(--panel-border); position: relative; }
  .flight-connector-plane { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 10px; color: var(--tclr, var(--accent)); background: var(--panel); padding: 0 3px; line-height: 1; }
  .flight-connector-num { font-size: 11px; color: var(--muted); margin-top: 6px; white-space: nowrap; text-align: center; font-weight: 600; }
  .flight-layover-chip { font-size: 10.5px; font-weight: 700; color: #8a5a00; background: #ffedc2; padding: 2px 6px; border-radius: 6px; margin-top: 4px; white-space: nowrap; }
  .flight-conf { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

  .timeline { margin-top: 2px; }
  .tl-row { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--panel-border); }
  .tl-row:first-child { border-top: 0; padding-top: 0; }
  .tl-date { font-size: 11.5px; font-weight: 800; color: var(--tclr, var(--accent)); padding-top: 1px; white-space: nowrap; }
  .tl-date.tl-none { color: var(--muted); font-weight: 700; }
  .tl-body strong { font-size: 13.5px; }

  .priority-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 9px; align-items: center; padding: 10px 0; border-top: 1px solid var(--panel-border); }
  .priority-row:first-child { border-top: 0; padding-top: 0; }
  .num { height: 24px; width: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--tclr, var(--accent)); color: #fff; font-weight: 800; font-size: 11.5px; flex-shrink: 0; }
  .num.flag { background: #9a3412; }

  .decision-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; font-size: 13.5px; }
  .decision-item .check { font-weight: 800; color: #1f6b3d; flex-shrink: 0; }

  .flag-box { background: #fde3d6; border: 1px solid rgba(154,52,18,.22); border-radius: 10px; padding: 11px 13px; color: #7c2d12; font-size: 13px; margin-top: 8px; }
  .flag-box strong { color: #7c2d12; }
  .callout { background: var(--bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 13px; }

  .option { border: 1px solid var(--panel-border); border-radius: 12px; padding: 13px 14px; margin-top: 10px; }
  .option.reco { border-color: #8cc7bf; background: #f4fbf9; }
  .option h3 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .option .price { white-space: nowrap; color: var(--muted); font-weight: 700; font-size: 12px; }
  .reco-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; margin-left: 7px; vertical-align: middle; }
  .option ul { margin: 7px 0 0; padding-left: 18px; font-size: 13px; }
  .option li { margin: 3px 0; }
  .tag { display: inline-block; background: #e3f2ef; color: #1c5852; padding: 3px 7px; border-radius: 7px; font-size: 11px; font-weight: 700; margin: 3px 5px 3px 0; }

  .day { display: grid; grid-template-columns: 78px 1fr; gap: 13px; padding: 14px 0; border-top: 1px solid var(--panel-border); }
  .day:first-of-type { border-top: 0; padding-top: 4px; }
  .day-date { font-weight: 800; color: var(--tclr, var(--accent)); font-size: 12.5px; }
  .day-date span { display: block; color: var(--muted); font-weight: 600; font-size: 10.5px; margin-top: 2px; }

  .dcard table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
  .dcard th, .dcard td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--panel-border); vertical-align: top; }
  .dcard th { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .dcard .total-row { font-weight: 800; }

  footer.status {
    margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--panel-border);
    color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  footer.status button {
    background: none; border: 1px solid var(--panel-border); color: var(--muted);
    padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ============================= SIGN-IN SCREEN ============================= -->
<div id="signin">
  <h1>Helm</h1>
  <p class="sub">Sign in with the account you created in Supabase.</p>
  <form id="signin-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="signin-btn">Sign in</button>
    <div class="error" id="signin-error"></div>
  </form>
</div>

<!-- ============================== MAIN APP ================================ -->
<div class="wrap" id="app" hidden>
  <div class="topbar">
    <div class="brand">Helm</div>
    <nav class="tabs">
      <button class="tab-btn active" data-view="today" type="button">Today</button>
      <button class="tab-btn" data-view="travel" type="button">Travel</button>
    </nav>
  </div>

  <!-- ---- Today view: the Daily-Brief-lite output. Deliberately separate from
       Travel below it — the brief is a thin view above all modules (today,
       Travel is the only one), not something owned by any one module. ---- -->
  <div class="view" id="view-today">
    <div class="card brief-card" id="brief-card" hidden>
      <div class="brief-date" id="brief-date"></div>
      <div id="brief-text"></div>
      <div class="provenance">
        <span id="brief-generated"></span>
      </div>
    </div>
  </div>

  <!-- ---- Travel view: multi-trip list (default) + per-trip detail. ---- -->
  <div class="view" id="view-travel" hidden>

    <!-- ---- List: all trips, grouped by category. ---- -->
    <div id="travel-list">

function fmtDate(d) {
  if (!d) return null;
  // d is a plain "YYYY-MM-DD" date (no time/timezone) from Postgres. Parsing
  // that directly with `new Date()` treats it as UTC midnight, which then
  // rolls back a day once displayed in an earlier-than-UTC timezone (e.g.
  // Eastern). Build the date from its local components instead so the day
  // shown always matches the day stored.
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function fmtCardDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function fmtDateTime(d) {
  if (!d) return null;
  return new Date(d).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtRelative(d) {
  if (!d) return "never verified";
  const then = new Date(d), now = new Date();
  const days = Math.floor((now - then) / 86400000);
  if (days <= 0) return "verified today";
  if (days === 1) return "verified yesterday";
  if (days < 30) return `verified ${days}d ago`;
  return `verified ${then.toLocaleDateString(undefined, { month: "short", year: "numeric" })}`;
}

// The plain "YYYY-MM-DD" for today, in the viewer's local timezone — same
// deliberately timezone-naive shape as the dates Postgres hands back
// elsewhere in this file (see fmtDate above).
function todayLocalDateStr() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}
function fmtBriefTimestamp(d, briefDateStr) {
  const then = new Date(d);
  const timeStr = then.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  // A brief is stale the moment it wasn't generated for today's actual
  // calendar date — exact comparison against the date the brief itself was
  // built for (raw_data.date), not an elapsed-time guess. A once-a-day job
  // that misses a single run produces a brief that's roughly 24-48 hours
  // old depending what time of day this is checked, which can dodge a
  // fixed elapsed-time cutoff either way (this is exactly what happened
  // 2026-09-20: a missed run's ~24h-old brief slipped under the old 36h
  // threshold) — an exact-date check has no such gap.
  const stale = briefDateStr ? briefDateStr !== todayLocalDateStr() : true;
  return { text: `Generated ${timeStr}`, stale };
}

// ---- Sync status (heartbeat) --------------------------------------------
// Surfaces the last run of every scheduled job from sync_log, not just the
// daily brief — this is what lets a silent job failure be seen on the Today
// tab instead of requiring a raw SQL query (ADR-4's "visible heartbeat"
// requirement, extended to cover all three scheduled jobs).
const SYNC_JOBS = [
  { jobName: "daily_brief_lite", label: "Brief" },
  { jobName: "lead_time_todoist_sync", label: "Tasks sync" },
  { jobName: "post_trip_review_prompt", label: "Review prompt" },
];

function fmtSyncTime(d) {
  return new Date(d).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function renderSyncStatus(rows) {
  if (!els.syncStatus) return;
  if (!rows) {
    els.syncStatus.hidden = true;
    return;
  }

  // rows are ordered newest-first; keep only the first (most recent) row
  // seen per job name.
  const latestByJob = new Map();
  for (const row of rows) {
    if (!latestByJob.has(row.job_name)) latestByJob.set(row.job_name, row);
  }

  const parts = SYNC_JOBS.map(({ jobName, label }) => {
    const row = latestByJob.get(jobName);
    if (!row) {
      return `<span class="job warn">${label}: never run</span>`;
    }
    const ageMs = new Date() - new Date(row.run_at);
    const stale = ageMs > 36 * 60 * 60 * 1000;
    const failed = row.status && row.status !== "success";
    const warn = stale || failed;
    const note = failed ? ` (${row.status})` : stale ? " (stale)" : "";
    return `<span class="job ${warn ? "warn" : "ok"}">${label} ${fmtSyncTime(row.run_at)} ${warn ? "⚠" : "✓"}${note}</span>`;
  });

  els.syncStatus.innerHTML = parts.join("");
  els.syncStatus.hidden = false;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function formatInlineBold(s) {
  // The AI's output (and this file's own trip-detail copy) uses **bold** for
  // emphasis — turn that into <strong> after escaping.
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

// Parses the brief's plain-text bullet format (see the Edge Function's
// phraseWithClaude prompt) into real markup: a headline, "## " section
// labels, and "- " bullets with **bold** titles.
function renderBriefBullets(raw) {
  const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  let html = "";
  let inList = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };

  for (const line of lines) {
    if (line.startsWith("## ")) {
      closeList();
      html += `<div class="brief-section">${escapeHtml(line.slice(3))}</div>`;
    } else if (line.startsWith("- ")) {
      if (!inList) { html += '<ul class="brief-list">'; inList = true; }
      html += `<li>${formatInlineBold(line.slice(2))}</li>`;
    } else {
      closeList();
      html += `<div class="brief-headline">${formatInlineBold(line)}</div>`;
    }
  }
  closeList();
  return html;
}

// ---- ADR-9: trip status is derived from dates on every load ----------------
// category === 'someday' is the only manual override (undated ideas).
// 'archived' is still honored as past, for trips hand-archived before ADR-9.
function todayLocalStr() {
  const n = new Date();
  const p = (x) => String(x).padStart(2, "0");
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
}

function tripStatus(t, today) {
  if (t.category === "someday") return "someday";
  if (t.category === "archived") return "past";
  const start = t.start_date;
  const end = t.end_date || t.start_date;
  if (!start) return "future"; // undated, not marked someday: keep visible, sorted last
  if (end < today) return "past";
  if (start <= today) return "current";
  return "future";
}

const tripReviewCache = {}; // trip_id -> review row | null

function plainText(s) {
  return String(s || "").replace(/\*\*/g, "");

// ADR-10: every captured record shows where it stands — captured (saved in
// Helm only), filed (also written into the Second Brain), or failed.
function recordStatusHtml(r) {
  if (!r) return "";
  const st = ["captured", "filed", "failed"].includes(r.status) ? r.status : "captured";
  const label = st === "filed" ? "Filed in Second Brain" : st === "failed" ? "Filing failed" : "Captured · not yet filed";
  const url = r.drive_doc_url && /^https:\/\/drive\.google\.com\//.test(r.drive_doc_url) ? r.drive_doc_url : "";
  return `<div style="margin-top:8px"><span class="rec-status ${st}">${label}</span>${url ? `<a class="rec-link" href="${escapeHtml(url).replace(/"/g, "&quot;")}" target="_blank" rel="noopener">Open document &rarr;</a>` : ""}</div>`;
}

}

function renderStatsBar(ahead, current, someday, past) {

    <div class="stat-card"><div class="stat-label">Someday ideas</div><div class="stat-value">${someday.length}</div></div>

}

async function loadTravelList() {
  const { data: trips, error } = await sb
    .from("trips")
    .select("*")
    .order("start_date", { ascending: true, nullsFirst: false });

  if (error) {
    els.travelUpcoming.innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }

  allTrips = trips || [];
  const today = todayLocalStr();
  const byStart = (a, b) => (a.start_date || "9999-99-99").localeCompare(b.start_date || "9999-99-99");

  const current = allTrips.filter((t) => tripStatus(t, today) === "current").sort(byStart);
  const ahead = allTrips.filter((t) => tripStatus(t, today) === "future").sort(byStart);
  const someday = allTrips.filter((t) => tripStatus(t, today) === "someday");
  const past = allTrips
    .filter((t) => tripStatus(t, today) === "past")
    .sort((a, b) => (b.end_date || b.start_date || "").localeCompare(a.end_date || a.start_date || ""));

  renderStatsBar(ahead, current, someday, past);

  els.travelCurrentWrap.hidden = current.length === 0;
  els.travelCurrent.innerHTML = current.map((t) => renderTripCard(t, "current")).join("");

  els.travelUpcoming.innerHTML = ahead.length
    ? ahead.map((t, i) => renderTripCard(t, i === 0 ? "next" : "")).join("")
    : `<div class="empty">No upcoming trips yet.</div>`;
  els.travelSomeday.innerHTML = someday.length
    ? someday.map((t) => renderMiniCard(t)).join("")
    : `<div class="empty">Nothing parked yet.</div>`;
  els.travelArchive.innerHTML = past.length
    ? past.map(renderPastCard).join("")
    : `<div class="empty">No past trips logged yet.</div>`;

  // Saved reviews for past trips, fetched once so expanding a card is instant.
  if (past.length) {
    const ids = past.map((t) => t.id);
    const { data: reviews, error: rErr } = await sb.from("trip_reviews").select("*").in("trip_id", ids).order("created_at", { ascending: false });
    if (!rErr) {
      ids.forEach((id) => { tripReviewCache[id] = null; });
      (reviews || []).forEach((r) => { if (!tripReviewCache[r.trip_id]) tripReviewCache[r.trip_id] = r; });
    }
  }
}

      : r && r.would_return === false ? "You said you wouldn't go back." : "";
    box.innerHTML = (r
      ? `${r.review_notes ? `<div>${escapeHtml(r.review_notes)}</div>` : ""}${returnLine ? `<div class="field-sub" style="margin-top:6px">${returnLine}</div>` : ""}${recordStatusHtml(r)}`
      : `<div class="field-sub">No review saved yet.</div>`)
      + `<button type="button" class="past-open">Full trip detail &rarr;</button>`;
  }
  box.hidden = !willOpen;
  head.setAttribute("aria-expanded", String(willOpen));
});

function backToTravelList() {
  els.travelDetail.hidden = true;
  els.travelList.hidden = false;
}
els.detailBackBtn.addEventListener("click", backToTravelList);

// ---- Travel: per-trip detail view ------------------------------------------

function renderHero(trip) {
  const d = trip.detail || {};
  const dateRange = trip.start_date ? `${fmtDate(trip.start_date)} – ${fmtDate(trip.end_date)}` : "";
  els.detailHero.innerHTML = `
    <section class="hero" ${colorStyle(d.color)}>
      ${d.eyebrow ? `<div class="eyebrow">${escapeHtml(d.eyebrow)}</div>` : ""}
      <h1>${escapeHtml(trip.destination || trip.name)}</h1>
      ${dateRange ? `<div class="daterange">${dateRange}</div>` : ""}
      ${d.hero_subtitle ? `<div class="hero-subtitle">${escapeHtml(d.hero_subtitle)}</div>` : ""}
      ${(d.hero_chips || []).length ? `<div class="chips-row">${d.hero_chips.map(chipHtml).join("")}</div>` : ""}
    </section>`;
}

function boldParagraphs(arr) {
  return (arr || []).map((p) => `<p>${formatInlineBold(p)}</p>`).join("");
}

function renderFlights(f) {
  if (!f) return "";
  const legs = (f.legs || []).map((leg) => `
    <div class="flight-visual">
      <div class="flight-leg-label">${escapeHtml(leg.label)}</div>
      <div class="flight-path">${leg.stops.map((s) => s.code
        ? `<div class="flight-stop"><div class="flight-stop-code">${escapeHtml(s.code)}</div><div class="flight-stop-time">${escapeHtml(s.time)}</div>${s.layover ? `<div class="flight-layover-chip">${escapeHtml(s.layover)}</div>` : ""}</div>`
        : `<div class="flight-connector"><div class="flight-connector-line"><span class="flight-connector-plane">&#9992;</span></div><div class="flight-connector-num">${escapeHtml(s.flight)}</div></div>`
      ).join("")}</div>
    </div>`).join("");
  return `<div class="dcard"><h2>Flights</h2>${legs}${f.note ? `<p class="field-sub">${escapeHtml(f.note)}</p>` : ""}${f.confirmation ? `<div class="flight-conf">${escapeHtml(f.confirmation)}</div>` : ""}</div>`;
}

function renderDining(dn) {
  if (!dn) return "";
  const rows = (dn.entries || []).map((e) => `
    <div class="tl-row">
      <div class="tl-date${e.date === "—" ? " tl-none" : ""}">${escapeHtml(e.date)}</div>
      <div class="tl-body"><strong>${escapeHtml(e.title)}</strong>${e.note ? `<span class="field-sub">${escapeHtml(e.note)}</span>` : ""}</div>
      ${pillHtml({ type: e.status, label: statusLabel(e.status) })}
    </div>`).join("");
  const optionsHtml = (dn.options || []).map((o) => `
    <div class="option">
      <h3><span>${escapeHtml(o.title)}</span></h3>
      <p>${escapeHtml(o.body)}</p>
    </div>`).join("");
  return `<div class="dcard"><h2>Dining</h2><div class="timeline">${rows}</div>${dn.note ? `<h3 style="margin-top:14px">${escapeHtml(dn.note)}</h3>` : ""}${optionsHtml}</div>`;
}

function renderCharterOptions(opts, note) {
  if (!opts || !opts.length) return "";
  const cards = opts.map((o) => `
    <div class="option${o.style === "reco" ? " reco" : ""}">
      <h3><span>${escapeHtml(o.title)}${o.badge ? `<span class="reco-badge">${escapeHtml(o.badge)}</span>` : ""}</span>${o.price ? `<span class="price">${escapeHtml(o.price)}</span>` : ""}</h3>
      <p>${escapeHtml(o.body)}</p>
      ${(o.bullets || []).length ? `<ul>${o.bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}</ul>` : ""}
      ${o.note ? `<p><strong>${escapeHtml(o.note)}</strong></p>` : ""}
      ${o.link_url ? `<p><a href="${escapeHtml(o.link_url)}" target="_blank" rel="noopener">${escapeHtml(o.link_text || o.link_url)} &rarr;</a></p>` : ""}
    </div>`).join("");
  return `<div class="dcard"><h2>Private charter options</h2>${cards}${note ? `<div class="callout">${escapeHtml(note)}</div>` : ""}</div>`;
}

function renderItinerary(days) {
  if (!days || !days.length) return "";
  const rows = days.map((day) => `
    <div class="day">
      <div class="day-date">${escapeHtml(day.date)}<span>${escapeHtml(day.label || "")}</span></div>
      <div>
        <h3>${escapeHtml(day.title)}${day.badge ? ` <span class="pill pill-open">${escapeHtml(day.badge)}</span>` : ""}</h3>
        <p>${formatInlineBold(day.body)}</p>
        ${(day.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
        ${day.callout ? `<div class="callout">${escapeHtml(day.callout)}</div>` : ""}
        ${day.note ? `<p class="field-sub">${escapeHtml(day.note)}</p>` : ""}
      </div>
    </div>`).join("");
  return `<div class="dcard"><h2>Trip at a glance</h2>${rows}</div>`;
}

function renderFlags(flags) {
  if (!flags || !flags.length) return "";
  return flags.map((f) => `<div class="dcard"><h2>${escapeHtml(f.title)}</h2><div class="flag-box">${formatInlineBold(f.body)}</div></div>`).join("");
}

function renderStillToBook(items, title) {
  if (!items || !items.length) return "";
  const rows = items.map((it) => `
    <div class="priority-row">
      <div class="num${it.status === "flag" ? " flag" : ""}">${it.priority ?? ""}</div>
      <div><strong>${escapeHtml(it.title)}</strong>${it.note ? `<br><span class="field-sub">${escapeHtml(it.note)}</span>` : ""}</div>
      ${pillHtml({ type: it.status || "open", label: statusLabel(it.status || "open") })}
    </div>`).join("");
  return `<div class="dcard"><h2>${escapeHtml(title)}</h2>${rows}</div>`;
}

function renderBookingPriorities(items) {
  if (!items || !items.length) return "";
  const rows = items.map((it) => `
    <div class="priority-row">
      <div class="num">${it.num}</div>
      <div><strong>${escapeHtml(it.title)}</strong>${it.note ? `<br><span class="field-sub">${escapeHtml(it.note)}</span>` : ""}</div>
      <span class="pill pill-info">${escapeHtml(it.tag)}</span>
    </div>`).join("");
  return `<div class="dcard"><h2>Booking priorities</h2>${rows}</div>`;
}

function renderCostsTable(costs, defaultTitle) {
  if (!costs) return "";
  const rows = (costs.rows || []).map((r) => `<tr><td>${escapeHtml(r.item)}</td><td>${escapeHtml(r.amount)}${r.note ? `<span class="field-sub">${escapeHtml(r.note)}</span>` : ""}</td></tr>`).join("");
  const totalRow = costs.total
    ? `<tr class="total-row"><td>Total</td><td>${escapeHtml(costs.total)}</td></tr>`
    : (costs.subtotal ? `<tr class="total-row"><td>Subtotal</td><td>${escapeHtml(costs.subtotal)}</td></tr>` : "");
  return `<div class="dcard"><h2>${escapeHtml(costs.title || defaultTitle)}</h2><table><tr><th>Item</th><th>Amount</th></tr>${rows}${totalRow}</table>${costs.note ? `<p class="field-sub">${escapeHtml(costs.note)}</p>` : ""}</div>`;
}

function renderInsurance(ins) {
  if (!ins) return "";
  return `<div class="dcard"><h2>${escapeHtml(ins.title)}</h2><p>${formatInlineBold(ins.body)}</p>${ins.sub ? `<p class="field-sub">${escapeHtml(ins.sub)}</p>` : ""}</div>`;
}

function renderDecisions(list) {
  if (!list || !list.length) return "";
  return `<div class="dcard"><h2>Decisions locked in</h2>${list.map((d) => `<div class="decision-item"><span class="check">&#10003;</span> ${formatInlineBold(d)}</div>`).join("")}</div>`;
}

function renderDetailSections(trip) {
  const s = (trip.detail && trip.detail.sections) || {};

  const main = [
    renderFlights(s.flights),
    renderItinerary(s.itinerary),
    renderDining(s.dining),
    renderCharterOptions(s.charter_options, s.charter_note),
    s.lodging ? `<div class="dcard"><h2>Lodging</h2>${boldParagraphs(s.lodging.paragraphs)}</div>` : "",
    s.transport ? `<div class="dcard"><h2>Ground transport</h2>${boldParagraphs(s.transport.paragraphs)}</div>` : "",
    renderFlags(s.flags),
    s.footnote ? `<div class="dcard" style="text-align:center;color:var(--muted);font-size:12px">${escapeHtml(s.footnote)}</div>` : "",
  ].filter(Boolean).join("");

  const aside = [
    renderBookingPriorities(s.booking_priorities) || renderStillToBook(s.still_to_book, "Still to book"),
    renderCostsTable(s.costs_committed, "Committed so far"),
    renderCostsTable(s.costs_budget, "Working budget"),
    renderInsurance(s.insurance),
    renderDecisions(s.decisions),
  ].filter(Boolean).join("");

  els.detailMain.innerHTML = main || `<div class="dcard"><p class="empty">No detail recorded yet for this trip.</p></div>`;
  els.detailAside.innerHTML = aside;
}

async function openTripDetail(tripId) {
  const trip = allTrips.find((t) => t.id === tripId);
  if (!trip) return;
  currentTrip = trip;

  els.travelList.hidden = true;
  els.travelDetail.hidden = false;
  window.scrollTo(0, 0);

  renderHero(trip);
  renderDetailSections(trip);

  const [
    { data: bookings, error: bErr },
    { data: tasks, error: tErr },
    { data: ownReviews, error: ownReviewErr },
    { data: pastReviews, error: pastReviewErr },
  ] = await Promise.all([
    sb.from("bookings").select("*").eq("trip_id", trip.id).order("start_at", { ascending: true, nullsFirst: false }),
    sb.from("trip_tasks").select("*").eq("trip_id", trip.id).order("due_date", { ascending: true }),
    sb.from("trip_reviews").select("*").eq("trip_id", trip.id).order("created_at", { ascending: false }).limit(1),
    sb.from("trip_reviews").select("*").ilike("destination", trip.destination || trip.name).neq("trip_id", trip.id).order("created_at", { ascending: false }).limit(1),
  ]);

  const hasBookings = !bErr && bookings && bookings.length > 0;
  const hasTasks = !tErr && tasks && tasks.length > 0;
  els.bookingsSection.hidden = !hasBookings;
  els.tasksSection.hidden = !hasTasks;
  els.bookingsList.innerHTML = hasBookings ? bookings.map(bookingCard).join("") : "";
  els.tasksList.innerHTML = hasTasks ? tasks.map(taskCard).join("") : "";

  renderReviewForm(!ownReviewErr && ownReviews && ownReviews.length ? ownReviews[0] : null);
  renderMemoryCard(!pastReviewErr && pastReviews && pastReviews.length ? pastReviews[0] : null);
}

// ---- Phase 4: trip memory (post-trip review + resurfacing) --------------
let currentReviewId = null;
let selectedWouldReturn = null;

document.querySelectorAll(".wr-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    selectedWouldReturn = btn.dataset.value === "true";
    document.querySelectorAll(".wr-btn").forEach((b) => b.classList.toggle("selected", b === btn));
  });
});

// Fills the review form from an existing trip_reviews row for this trip, if
// one was already saved, so re-opening the app doesn't lose what you wrote.
function renderReviewForm(existing) {
  currentReviewId = existing ? existing.id : null;
  els.reviewNotes.value = existing ? (existing.review_notes || "") : "";
  selectedWouldReturn = existing ? existing.would_return : null;

  document.querySelectorAll(".wr-btn").forEach((b) => {
    const btnVal = b.dataset.value === "true";
    b.classList.toggle("selected", existing != null && existing.would_return === btnVal);
  });

  if (existing) {
    els.reviewSavedNote.textContent = `Saved ${fmtDateTime(existing.created_at)} — edit and save again to update.` + (existing.status === "filed" ? " Filed in Second Brain." : " Not yet filed in Second Brain.");
    els.reviewSavedNote.hidden = false;
  } else {
    els.reviewSavedNote.hidden = true;
  }
}

// Renders the "you've been here before" card from the most recent review of
// a different trip to the same destination — this is the resurfacing logic
// Phase 4's gate requires: it has to show up on its own, not on request.
function renderMemoryCard(memory) {
  if (!memory) {
    els.memorySection.innerHTML = "";
    return;
  }
  const when = new Date(memory.created_at).toLocaleDateString(undefined, { month: "short", year: "numeric" });
  const returnLine = memory.would_return === true
    ? "You said you'd go back."
    : memory.would_return === false
      ? "You said you wouldn't go back."
      : "";
  els.memorySection.innerHTML = `
    <div class="card memory-card">
      <div class="memory-label">You've been here before</div>
      <div class="card-title">${escapeHtml(currentTrip.destination || currentTrip.name)} — reviewed ${when}</div>
      ${memory.review_notes ? `<div class="card-meta">${escapeHtml(memory.review_notes)}</div>` : ""}
      ${returnLine ? `<div class="card-when">${returnLine}</div>` : ""}
    </div>`;
}

els.reviewSaveBtn.addEventListener("click", async () => {
  if (!currentTrip) return;
  els.reviewSaveBtn.disabled = true;
  els.reviewSavedNote.hidden = true;

  const { data: { user } } = await sb.auth.getUser();
  const payload = {
    owner_id: user.id,
    trip_id: currentTrip.id,
    destination: currentTrip.destination || currentTrip.name,
    review_notes: els.reviewNotes.value.trim() || null,
    would_return: selectedWouldReturn,
    status: "captured", // an edit means the Second Brain copy is out of date — a Claude session re-files it
  };

  const { data, error } = currentReviewId
    ? await sb.from("trip_reviews").update(payload).eq("id", currentReviewId).select().single()
    : await sb.from("trip_reviews").insert(payload).select().single();

  els.reviewSaveBtn.disabled = false;

  if (error) {
    els.reviewSavedNote.textContent = "Could not save: " + error.message;
    els.reviewSavedNote.hidden = false;
    return;
  }

  currentReviewId = data.id;
  els.reviewSavedNote.textContent = `Saved ${fmtDateTime(data.created_at)} — edit and save again to update. Not yet filed in Second Brain.`;
  els.reviewSavedNote.hidden = false;
});

async function loadBriefAndSync() {
  const [
    { data: briefs, error: brErr },
    { data: syncRows, error: syncErr },
  ] = await Promise.all([
    sb.from("daily_briefs").select("brief_text, generated_at, raw_data").order("generated_at", { ascending: false }).limit(1),
    sb.from("sync_log").select("job_name, run_at, status").order("run_at", { ascending: false }).limit(20),
  ]);

  // Daily brief is best-effort — if the table isn't there yet or the query
  // fails, just hide the card rather than blocking the rest of the page.
  renderBrief(!brErr && briefs && briefs.length ? briefs[0] : null);

  // Same best-effort treatment for the sync heartbeat — never let this row
  // block the rest of the page from rendering.
  renderSyncStatus(syncErr ? null : syncRows);

  els.lastLoaded.textContent = "Loaded " + new Date().toLocaleTimeString();
}

async function showApp() {
  els.signin.hidden = true;
  els.app.hidden = false;
  await Promise.all([loadTravelList(), loadBriefAndSync()]);
}

function showSignin(message) {
  els.app.hidden = true;
  els.signin.hidden = false;
  els.signinError.textContent = message || "";
}

els.signinForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  els.signinBtn.disabled = true;
  els.signinError.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({ email, password });
  els.signinBtn.disabled = false;

  if (error) {
    els.signinError.textContent = error.message;
    return;
  }
  await showApp();
});

els.signoutBtn.addEventListener("click", async () => {
  await sb.auth.signOut();
  showSignin();
});

// On load, pick up an existing session (so you're not asked to sign in every
// single time you open the page — Supabase keeps the session in the browser).
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await showApp();
  }
})();
</script>
</body>
</html>
